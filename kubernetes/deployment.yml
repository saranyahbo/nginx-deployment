apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: eks-nginx

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: frontend
    template:
      metadata:
        name: frontend
        labels:
          app: frontend
      spec: 
        containers:
          - name: frontend
            image: 598206844002.dkr.ecr.us-east-1.amazonaws.com/learn-eks:latest
            ports:
              - containerPort: 80
            
            resources: 
              requests: 
                cpu: "100m"
                memory: "64Mi"  

              limits: 
                cpu: "250m"
                memory: "128Mi"
              
            readinessProbe:
              httpGet:
                path: /
                port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
            
            livenessProbe:
              httpGet:
                path: /
                port: 80
                  initialDelaySeconds: 15
                  periodSeconds: 20
